name: check
on:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min (UTC). GitHub drops many slots on the free tier, more slots = more runs
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification only"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node check.ts ${{ inputs.test && '--test' || '' }}
      - name: Save state
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "stock-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "state: $(cat state.json)"
            git push
          fi
